<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Честный Отзыв — платформа отзывов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #0B1120;
            font-family: 'Inter', sans-serif;
            color: #E2E8F0;
        }
        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #A78BFA);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .card-custom {
            background: #1A2335;
            border: 1px solid #2D3748;
            color: #E2E8F0;
        }
        .feature-text {
            color: #E2E8F0;
        }
        @media (max-width: 700px) {
            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>

    <div class="container py-5">
        <div class="text-center">
            <h1 class="mb-3">Реальные мнения! Никаких фейков!</h1>
            <p class="text-secondary mb-4">Платформа, где КАЖДЫЙ голос имеет значение.</p>
        </div>

        <div id="mainContent" class="mt-5"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/navbar.js"></script>
    <script>
        async function loadContent() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                const mainDiv = document.getElementById('mainContent');
                
                if (data.isAuthenticated && data.user) {
                    mainDiv.innerHTML = `
                        <div class="card card-custom rounded-4 p-5 text-center">
                            <h2 class="text-white mb-3">✨ Добро пожаловать, ${escapeHtml(data.user.name)}!</h2>
                            <p class="text-secondary mb-0">Рады видеть вас снова!</p>
                        </div>
                    `;
                } else {
                    mainDiv.innerHTML = `
                        <div class="d-flex gap-3 justify-content-center flex-wrap">
                            <a href="/register.html" class="btn btn-primary rounded-pill px-4">Создать аккаунт</a>
                            <a href="/login.html" class="btn btn-outline-secondary rounded-pill px-4">Уже есть аккаунт</a>
                        </div>
                        <div class="row g-4 mt-4">
                            <div class="col-md-3 col-6">
                                <div class="card card-custom rounded-4 p-3 text-center">
                                    <div class="fs-1">🔍</div>
                                    <div class="mt-2 feature-text">Честные оценки</div>
                                </div>
                            </div>
                            <div class="col-md-3 col-6">
                                <div class="card card-custom rounded-4 p-3 text-center">
                                    <div class="fs-1">🏷️</div>
                                    <div class="mt-2 feature-text">Теги для товаров</div>
                                </div>
                            </div>
                            <div class="col-md-3 col-6">
                                <div class="card card-custom rounded-4 p-3 text-center">
                                    <div class="fs-1">🛡️</div>
                                    <div class="mt-2 feature-text">Защита от накрутки</div>
                                </div>
                            </div>
                            <div class="col-md-3 col-6">
                                <div class="card card-custom rounded-4 p-3 text-center">
                                    <div class="fs-1">📱</div>
                                    <div class="mt-2 feature-text">Адаптивный дизайн</div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Ошибка:', err);
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, (m) => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadContent, 100);
        });
    </script>
</body>
</html>
