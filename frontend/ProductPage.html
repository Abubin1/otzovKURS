<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров — Честный Отзыв</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0B1120;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }
        .navbar {
            background: #111827 !important;
            border-bottom: 1px solid #2D3748;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #C084FC, #818CF8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }
        .product-card {
            background: #1A2335;
            border: 1px solid #2D3748;
            transition: 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: #6C63FF;
        }
        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .product-category {
            font-size: 12px;
            color: #A78BFA;
        }
        .product-rating {
            font-size: 14px;
            color: #FBBF24;
        }
        .product-reviews, .product-address {
            font-size: 12px;
        }
        .product-address {
            color: #6C63FF;
        }
        .tag-btn {
            background: #0B1120;
            border: 1px solid #2D3748;
            color: #94A3B8;
            transition: 0.2s;
        }
        .tag-btn:hover {
            border-color: #6C63FF;
            color: #E2E8F0;
        }
        .tag-btn.active {
            background: #6C63FF;
            border-color: #6C63FF;
            color: white;
        }
        .selected-tag-badge {
            background: #6C63FF;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .selected-tag-badge button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.8;
        }
        .selected-tag-badge button:hover {
            opacity: 1;
        }
        .no-results {
            background: #1A2335;
        }
        @media (max-width: 576px) {
            .products-grid {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>
<body>

    <!-- Навбар-->
    <div id="navbar-container"></div>

    <div class="container py-3">
        <h1 class="mb-4" style="background: linear-gradient(135deg, #FFFFFF, #A78BFA); -webkit-background-clip: text; background-clip: text; color: transparent;">
            <i class="fas fa-store"></i> Каталог товаров
        </h1>

        <!-- Фильтры: поиск + категория + сброс -->
        <div class="bg-dark bg-opacity-25 rounded-4 p-4 mb-4" style="background: #1A2335;">
            <div class="row g-3">
                <div class="col-md-5 col-lg-6">
                    <label class="form-label text-secondary small fw-semibold">
                        <i class="fas fa-search"></i> Поиск:
                    </label>
                    <input type="text" id="searchInput" class="form-control bg-dark text-white border-secondary rounded-pill" placeholder="Название товара...">
                </div>
                <div class="col-md-4 col-lg-4">
                    <label class="form-label text-secondary small fw-semibold">
                        <i class="fas fa-folder"></i> Категория:
                    </label>
                    <select id="categoryFilter" class="form-select bg-dark text-white border-secondary rounded-pill">
                        <option value="all">Все категории</option>
                    </select>
                </div>
                <div class="col-md-3 col-lg-2">
                    <label class="form-label text-secondary small fw-semibold invisible">Сброс</label>
                    <button id="resetBtn" class="btn btn-danger w-100 rounded-pill">
                        <i class="fas fa-undo-alt"></i> Сбросить
                    </button>
                </div>
            </div>
        </div>

        <!-- фильтрация по тегам -->
        <div class="rounded-4 p-4 mb-4" style="background: #1A2335;">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <h6 class="text-white mb-0"><i class="fas fa-tags"></i> Фильтр по тегам</h6>
                <button class="btn btn-sm btn-outline-secondary rounded-pill" id="clearTagFilter">
                    <i class="fas fa-times"></i> Сбросить теги
                </button>
            </div>
            
            <input type="text" id="tagSearchInput" class="form-control form-control-sm bg-dark text-white border-secondary rounded-pill mb-3" 
                   style="max-width: 250px;" placeholder="🔍 Поиск тега...">
            
            <div id="filterTagsContainer" class="d-flex flex-wrap gap-2 mb-3">
                <span class="text-secondary">Загрузка тегов...</span>
            </div>
            
            <div id="selectedTagsContainer" class="d-flex flex-wrap gap-2"></div>
        </div>

        <!-- Сетка товаров -->
        <div id="productsGrid" class="products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let allProducts = [];
        let categories = [];
        let allFilterTags = [];     // Все теги для фильтрации
        let selectedTagIds = [];    // Выбранные айди тегов

        // Загрузка категорий из БД
        async function loadCategories() {
            try {
                const response = await fetch('/api/categories');
                const data = await response.json();
                if (data.success) {
                    categories = data.categories;
                    const select = document.getElementById('categoryFilter');
                    categories.forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat.id;
                        option.textContent = cat.name;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Ошибка загрузки категорий:', error);
            }
        }

        // Загрузка товаров из БД
        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                const data = await response.json();
                if (data.success) {
                    allProducts = data.products;
                    applyAllFilters(); // применяем все фильтры сразу
                } else {
                    document.getElementById('productsGrid').innerHTML = '<div class="no-results p-5 text-center rounded-4">❌ Ошибка загрузки товаров</div>';
                }
            } catch (error) {
                console.error('Ошибка загрузки товаров:', error);
                document.getElementById('productsGrid').innerHTML = '<div class="no-results p-5 text-center rounded-4">❌ Не удалось загрузить товары. Проверьте соединение с сервером.</div>';
            }
        }
        
        function getCategoryName(categoryId) {
            const cat = categories.find(c => c.id == categoryId);
            return cat ? cat.name : 'Без категории';
        }

        //объединяет поиск, категорию и теги
        function applyAllFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryId = document.getElementById('categoryFilter').value;

            let filtered = [...allProducts];

            // 1. фильтр по поиску
            if (searchTerm) {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm));
            }

            // 2. фильтр по категории
            if (categoryId !== 'all') {
                filtered = filtered.filter(p => p.category_id == categoryId);
            }

            // 3. фильтр по тегам (если есть выбранные теги)
            if (selectedTagIds.length > 0) {
                filtered = filtered.filter(product => {
                    // проверяем, есть ли у товара все выбранные теги
                    if (!product.tags || !Array.isArray(product.tags)) return false;
                    return selectedTagIds.every(tagId => product.tags.includes(tagId));
                });
            }

            // отрисовываем результат
            const grid = document.getElementById('productsGrid');
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-results p-5 text-center rounded-4" style="background: #1A2335; grid-column: 1/-1;">😕 Товаров не найдено. Попробуйте другие фильтры.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(product => `
                <div class="product-card rounded-4 p-3 h-100" onclick="openProductCard(${product.id})">
                    <div class="product-title">${escapeHtml(product.name)}</div>
                    <div class="product-category mb-2">${getCategoryName(product.category_id)}</div>
                    <div class="product-rating mb-1">⭐ ${parseFloat(product.avg_rating).toFixed(1)} / 5</div>
                    <div class="product-reviews mb-2">📝 ${product.review_count || 0} отзывов</div>
                    ${product.address ? `<div class="product-address">📍 ${escapeHtml(product.address)}</div>` : ''}
                </div>
            `).join('');
        }

        window.openProductCard = function(productId) {
            window.location.href = `/productCard.html?id=${productId}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Сброс ВСЕХ фильтров (поиск, категория, теги)
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = 'all';
            // сбрасываем теги
            selectedTagIds = [];
            renderFilterTags(allFilterTags);
            renderSelectedTags();
            // применяем фильтры
            applyAllFilters();
        }

        // получаем все теги
        async function loadFilterTags() {
            try {
                const response = await fetch('/api/tags');
                const data = await response.json();
                
                if (data.success) {
                    allFilterTags = data.tags;
                    renderFilterTags(allFilterTags);
                } else {
                    document.getElementById('filterTagsContainer').innerHTML = 
                        '<span class="text-danger">Ошибка загрузки тегов</span>';
                }
            } 
            catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('filterTagsContainer').innerHTML = 
                    '<span class="text-danger">Ошибка загрузки</span>';
            }
        }

// рисуем кнопки тегов, отслеживаем выбор/отмену + поиск по названию тега
function renderFilterTags(tags) {
    const searchTerm = document.getElementById('tagSearchInput')?.value.toLowerCase() || '';
    const LIMIT = 30; // показывать не больше 30 тегов 
    
    // Фильтруем теги по поисковому запросу
    let filteredTags = tags;
    if (searchTerm) {
        filteredTags = tags.filter(tag => tag.name.toLowerCase().includes(searchTerm));
    }
    
    const container = document.getElementById('filterTagsContainer');
    const totalCount = filteredTags.length;
    
    if (filteredTags.length === 0) {
        container.innerHTML = '<span class="text-secondary">Теги не найдены</span>';
        return;
    }
    
    // показываем только первые LIMIT тегов
    let displayTags = filteredTags.slice(0, LIMIT);
    
    container.innerHTML = displayTags.map(tag => `
        <button class="tag-btn btn btn-sm rounded-pill ${selectedTagIds.includes(tag.id) ? 'active' : ''}"
                onclick="toggleTagFilter(${tag.id})"
                data-tag-id="${tag.id}">
            ${escapeHtml(tag.name)}
        </button>
    `).join('');
    
    // если тегов больше LIMIT - показываем сообщение
    if (totalCount > LIMIT) {
        const remainingCount = totalCount - LIMIT;
        const searchHint = searchTerm ? ` (по запросу найдено еще ${remainingCount})` : ` (еще ${remainingCount})`;
        container.innerHTML += `<div class="text-secondary small w-100 mt-2"> Показаны первые ${LIMIT} тегов${searchHint}. Уточните поиск, чтобы увидеть больше.</div>`;
    }
}

    // Функция для показа всех тегов
    window.showAllTags = function() {
        // Убираем лимит и перерисовываем
        const container = document.getElementById('filterTagsContainer');
        const allTags = allFilterTags;
        
        container.innerHTML = allTags.map(tag => `
            <button class="tag-btn btn btn-sm rounded-pill ${selectedTagIds.includes(tag.id) ? 'active' : ''}"
                    onclick="toggleTagFilter(${tag.id})">
                ${escapeHtml(tag.name)}
            </button>
        `).join('');
    }

        // переключаем фильтр по тегу
        window.toggleTagFilter = function(tagId) {
            const index = selectedTagIds.indexOf(tagId);
            if (index === -1) {
                selectedTagIds.push(tagId);
            } else {
                selectedTagIds.splice(index, 1);
            }
            
            // Обновляем отображение кнопок
            renderFilterTags(allFilterTags);
            
            // Показываем выбранные теги
            renderSelectedTags();
            
            // Применяем все фильтры (поиск + категория + теги)
            applyAllFilters();
        };  

        // выбранные теги
        function renderSelectedTags() {
            const container = document.getElementById('selectedTagsContainer');
            
            if (selectedTagIds.length === 0) {
                container.innerHTML = '';
                return;
            }
            
            const selectedTags = allFilterTags.filter(tag => selectedTagIds.includes(tag.id));
            
            container.innerHTML = selectedTags.map(tag => `
                <span class="selected-tag-badge badge rounded-pill px-3 py-2">
                    ${escapeHtml(tag.name)}
                    <button onclick="toggleTagFilter(${tag.id})" title="Убрать тег">✕</button>
                </span>
            `).join('');
        }

        // сброс фильтра по тегам
        document.getElementById('clearTagFilter')?.addEventListener('click', () => {
            selectedTagIds = [];
            renderFilterTags(allFilterTags);
            renderSelectedTags();
            applyAllFilters(); // обновляем список товаров
        });

        // поиск тега
        document.getElementById('tagSearchInput')?.addEventListener('input', () => {
            renderFilterTags(allFilterTags);
        });

        // обработчики для основного поиска и категории - теперь вызывают applyAllFilters
        document.getElementById('searchInput').addEventListener('input', applyAllFilters);
        document.getElementById('categoryFilter').addEventListener('change', applyAllFilters);
        document.getElementById('resetBtn').addEventListener('click', resetFilters);

        // загружаем всё при старте
        loadCategories();
        loadFilterTags();
        loadProducts();
    </script>
    <script src="/navbar.js"></script>
</body>
</html>
