<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Честный Отзыв</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0B1120 0%, #19223B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            padding: 40px 32px;
            transition: all 0.3s ease;
        }

        .register-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 12px;
        }

        h1 {
            color: #FFFFFF;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8E9BB1;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #C9D3E8;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: #1A2335;
            border: 1.5px solid #2A3448;
            border-radius: 14px;
            font-size: 15px;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #6C63FF;
            background: #1F2A40;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
        }

        input.is-invalid {
            border-color: #FF5A5A;
            background: #2A1A2A;
        }

        input.is-valid {
            border-color: #4CAF50;
        }

        .invalid-feedback {
            color: #FF8A8A;
            font-size: 12px;
            margin-top: 6px;
        }

        .form-text {
            color: #6C7A94;
            font-size: 11px;
            margin-top: 5px;
            display: block;
        }

        .password-strength {
            font-size: 12px;
            margin-top: 8px;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(95deg, #6C63FF 0%, #3F3A9E 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            font-family: 'Inter', sans-serif;
        }

        .btn-register:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 99, 255, 0.3);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            color: #8E9BB1;
            font-size: 14px;
        }

        .login-link a {
            color: #6C63FF;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .alert-success {
            background: #1E3A2F;
            border: 1px solid #4CAF50;
            color: #B9F6CA;
        }

        .alert-danger {
            background: #3A1E2A;
            border: 1px solid #FF5A5A;
            color: #FFB3B3;
        }

        .row-2cols {
            display: flex;
            gap: 16px;
        }

        .row-2cols .form-group {
            flex: 1;
        }

        @media (max-width: 550px) {
            .register-container {
                padding: 28px 20px;
            }
            .row-2cols {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="logo">⭐️</div>
            <h1>Создать аккаунт</h1>
            <div class="subtitle">Присоединяйтесь к сообществу честных отзывов</div>
        </div>

        <div id="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Имя *</label>
                <input type="text" id="name" placeholder="Алексей Смирнов">
                <div class="invalid-feedback" id="nameError"></div>
            </div>

            <div class="row-2cols">
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" id="phone" placeholder="+7 999 123-45-67">
                    <div class="invalid-feedback" id="phoneError"></div>
                </div>
                <div class="form-group">
                    <label>Дата рождения *</label>
                    <input type="date" id="birth_date">
                    <div class="invalid-feedback" id="birthError"></div>
                </div>
            </div>

            <div class="row-2cols">
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" placeholder="alex@example.com">
                    <div class="invalid-feedback" id="emailError"></div>
                </div>
                <div class="form-group">
                    <label>Город *</label>
                    <input type="text" id="city" placeholder="Москва">
                    <div class="invalid-feedback" id="cityError"></div>
                </div>
            </div>

            <div class="row-2cols">
                <div class="form-group">
                    <label>Пароль *</label>
                    <input type="password" id="password" placeholder="от 4 символов">
                    <div class="invalid-feedback" id="passwordError"></div>
                    <div id="passwordStrength" class="password-strength"></div>
                </div>
                <div class="form-group">
                    <label>Подтверждение *</label>
                    <input type="password" id="password_confirm" placeholder="повторите пароль">
                    <div class="invalid-feedback" id="passwordConfirmError"></div>
                </div>
            </div>

            <button type="submit" class="btn-register" id="submitBtn">Зарегистрироваться →</button>
        </form>

        <div class="login-link">
            Уже есть аккаунт? <a href="/login.html">Войти</a>
        </div>
    </div>

    <script>
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const emailInput = document.getElementById('email');
        const birthInput = document.getElementById('birth_date');
        const cityInput = document.getElementById('city');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('password_confirm');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');

        function cleanPhone(phone) {
            return phone.replace(/[\s\-\(\)]/g, '');
        }

        function validatePhone(phone) {
            if (!phone) return false;
            const cleaned = cleanPhone(phone);
            return /^(\+7|8|9)?\d{10}$/.test(cleaned);
        }

        function validateName(name) {
            return name && name.trim().length >= 2 && name.trim().length <= 100;
        }

        function validateEmail(email) {
            return email && /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email);
        }

        function validateBirthDate(date) {
            if (!date) return false;
            const today = new Date();
            const birth = new Date(date);
            return birth <= today;
        }

        function validateCity(city) {
            return city && city.trim().length >= 2;
        }

        function validatePassword(password) {
            return password && password.length >= 4;
        }

        function validatePasswordConfirm() {
            return passwordInput.value === passwordConfirmInput.value;
        }

        function checkPasswordStrength(password) {
            if (!password) return '';
            let strength = 0;
            if (password.length >= 6) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;
            const texts = ['Очень слабый', 'Слабый', 'Средний', 'Хороший', 'Отличный'];
            const colors = ['#FF5A5A', '#FF9F4A', '#FFD93D', '#6CFF6C', '#6C63FF'];
            const idx = Math.min(strength, 4);
            return `<span style="color: ${colors[idx]}">🔐 ${texts[idx]}</span>`;
        }

        function showError(input, message, errorId) {
            input.classList.add('is-invalid');
            input.classList.remove('is-valid');
            document.getElementById(errorId).textContent = message;
        }

        function showValid(input, errorId) {
            input.classList.add('is-valid');
            input.classList.remove('is-invalid');
            const el = document.getElementById(errorId);
            if (el) el.textContent = '';
        }

        function clearValidation(input, errorId) {
            input.classList.remove('is-valid', 'is-invalid');
            const el = document.getElementById(errorId);
            if (el) el.textContent = '';
        }

        function checkFormValidity() {
            let isValid = true;

            if (!nameInput.value) {
                clearValidation(nameInput, 'nameError');
                isValid = false;
            } else if (!validateName(nameInput.value)) {
                showError(nameInput, 'Имя: 2–100 символов', 'nameError');
                isValid = false;
            } else {
                showValid(nameInput, 'nameError');
            }

            if (!phoneInput.value) {
                clearValidation(phoneInput, 'phoneError');
                isValid = false;
            } else if (!validatePhone(phoneInput.value)) {
                showError(phoneInput, '+79991234567 или 89123456789', 'phoneError');
                isValid = false;
            } else {
                showValid(phoneInput, 'phoneError');
            }

            if (!emailInput.value) {
                showError(emailInput, 'Email обязателен', 'emailError');
                isValid = false;
            } else if (!validateEmail(emailInput.value)) {
                showError(emailInput, 'example@domain.ru', 'emailError');
                isValid = false;
            } else {
                showValid(emailInput, 'emailError');
            }

            if (!birthInput.value) {
                clearValidation(birthInput, 'birthError');
                isValid = false;
            } else if (!validateBirthDate(birthInput.value)) {
                showError(birthInput, 'Дата не может быть в будущем', 'birthError');
                isValid = false;
            } else {
                showValid(birthInput, 'birthError');
            }

            if (!cityInput.value) {
                clearValidation(cityInput, 'cityError');
                isValid = false;
            } else if (!validateCity(cityInput.value)) {
                showError(cityInput, 'Минимум 2 символа', 'cityError');
                isValid = false;
            } else {
                showValid(cityInput, 'cityError');
            }

            if (!passwordInput.value) {
                clearValidation(passwordInput, 'passwordError');
                isValid = false;
            } else if (!validatePassword(passwordInput.value)) {
                showError(passwordInput, 'Пароль ≥ 4 символов', 'passwordError');
                isValid = false;
            } else {
                showValid(passwordInput, 'passwordError');
            }

            if (!passwordConfirmInput.value) {
                clearValidation(passwordConfirmInput, 'passwordConfirmError');
                isValid = false;
            } else if (!validatePasswordConfirm()) {
                showError(passwordConfirmInput, 'Пароли не совпадают', 'passwordConfirmError');
                isValid = false;
            } else {
                showValid(passwordConfirmInput, 'passwordConfirmError');
            }

            submitBtn.disabled = !isValid;
            return isValid;
        }

        nameInput.addEventListener('input', checkFormValidity);
        phoneInput.addEventListener('input', checkFormValidity);
        emailInput.addEventListener('input', checkFormValidity);
        birthInput.addEventListener('change', checkFormValidity);
        cityInput.addEventListener('input', checkFormValidity);
        passwordInput.addEventListener('input', () => {
            checkFormValidity();
            const strengthDiv = document.getElementById('passwordStrength');
            if (passwordInput.value) {
                strengthDiv.innerHTML = checkPasswordStrength(passwordInput.value);
            } else {
                strengthDiv.innerHTML = '';
            }
        });
        passwordConfirmInput.addEventListener('input', checkFormValidity);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!checkFormValidity()) return;

            const data = {
                name: nameInput.value.trim(),
                phone: cleanPhone(phoneInput.value),
                email: emailInput.value.trim(),
                birth_date: birthInput.value,
                city: cityInput.value.trim(),
                password: passwordInput.value
            };

            submitBtn.disabled = true;
            submitBtn.textContent = 'Регистрация...';
            messageDiv.innerHTML = '';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok && result.success) {
                    messageDiv.innerHTML = '<div class="alert alert-success">✅ Регистрация прошла! Перенаправление...</div>';
                    setTimeout(() => window.location.href = '/', 1300);
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger">❌ ${result.error || 'Ошибка'}</div>`;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Зарегистрироваться →';
                }
            } catch (err) {
                messageDiv.innerHTML = '<div class="alert alert-danger">❌ Ошибка соединения с сервером</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Зарегистрироваться →';
            }
        });

        const today = new Date();
        const minDate = new Date(today.getFullYear() - 100, today.getMonth(), today.getDate());
        birthInput.max = today.toISOString().split('T')[0];
        birthInput.min = minDate.toISOString().split('T')[0];
        checkFormValidity();
    </script>
</body>
</html>
