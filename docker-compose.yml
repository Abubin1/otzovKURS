version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: otziv_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: otzivBD
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4

  adminer:
    image: adminer:latest
    container_name: otziv_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql

  backend:
    build: ./backend
    container_name: otziv_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: otzivBD
      PORT: 3000
      SESSION_SECRET: superpupermegasecret
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - /app/node_modules

volumes:
  mysql_data: